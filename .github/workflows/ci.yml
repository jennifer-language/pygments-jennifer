# SPDX-License-Identifier: BSD-2-Clause

name: CI

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}, Pygments ${{ matrix.pygments }}
    runs-on: ubuntu-latest
    # The official Python images, not actions/setup-python: it has no builds of
    # an end-of-life Python (3.9) for current runner images.
    container: python:${{ matrix.python }}-slim
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # The floor in pyproject.toml and the newest release.
        pygments: ["2.13.0", "latest"]
    steps:
      - uses: actions/checkout@v5

      - name: Install the plugin
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          if [ "${{ matrix.pygments }}" != latest ]; then
            python -m pip install "pygments==${{ matrix.pygments }}"
          fi
          python -m pip show pygments | head -2

      - name: Tests
        run: python -m pytest -q

      - name: pygmentize finds the lexer
        run: |
          set -eu
          pygmentize -L lexers | grep -q 'jennifer:'
          pygmentize -l jennifer -f html tests/example.j > /dev/null
          pygmentize -f html tests/example.j > /dev/null

  # The copies must match the interpreter repository's editors/pygments/.
  sync:
    name: Copies match jennifer/editors/pygments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/checkout@v5
        with:
          repository: jennifer-language/jennifer
          path: .jennifer
          sparse-checkout: editors/pygments

      - name: Compare
        env:
          JENNIFER_EDITORS: .jennifer/editors/pygments
        run: tools/sync.sh --check

  # A version tag builds the sdist and wheel once the tests and the sync check
  # pass, and publishes them to PyPI as a trusted publisher (OIDC, no token).
  # GitHub only: Forgejo runs the checks above and nothing else.
  publish:
    name: Publish to PyPI
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/')
    needs: [test, sync]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pygments-jennifer/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: The tag is the package version
        run: |
          set -eu
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          init="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pygments_jennifer/__init__.py)"
          if [ "$GITHUB_REF_NAME" != "$version" ] || [ "$init" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME, pyproject.toml $version, __version__ $init"
            exit 1
          fi

      - name: Build the sdist and the wheel
        run: |
          set -eu
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          ls -l dist

      - uses: pypa/gh-action-pypi-publish@release/v1
