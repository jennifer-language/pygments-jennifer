# SPDX-License-Identifier: BSD-2-Clause

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygments-jennifer"
version = "0.1.0"
description = "Pygments lexer plugin for the Jennifer programming language"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "mplx", email = "mplx@jennifer-lang.dev" }]
requires-python = ">=3.9"
dependencies = ["pygments>=2.13"]
keywords = ["pygments", "lexer", "syntax highlighting", "jennifer"]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Filters",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://jennifer-lang.dev/"
Source = "https://github.com/jennifer-language/pygments-jennifer"

# Pygments finds plugin lexers through this entry-point group. The key is not
# significant; the value is `module:Class`.
[project.entry-points."pygments.lexers"]
jennifer = "pygments_jennifer.lexer:JenniferLexer"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/pygments_jennifer"]
